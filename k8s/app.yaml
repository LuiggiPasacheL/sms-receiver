apiVersion: apps/v1
kind: Deployment
metadata:
  name: sms-receiver
  namespace: sms-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sms-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sms-receiver
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace the username/tag with the public image you pushed.
          image: docker.io/luiggip/sms-receiver:1.0.0
          # Resolve the tag from the registry whenever a new container starts.
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          env:
            #  k -n sms-receiver create secret generic sms-receiver-secrets --from-literal=DATABASE_URL=postgres://postgres:PASSWORD@IP:5432/DATABASE --from-literal=FORWARDER_TOKEN=TOKEN --from-literal=VIEWER_PASSWORD=PASS --dry-run=client -o yaml | k -n sms-receiver apply -f -
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sms-receiver-secrets
                  key: DATABASE_URL
            - name: VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sms-receiver-secrets
                  key: VIEWER_PASSWORD
            - name: FORWARDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sms-receiver-secrets
                  key: FORWARDER_TOKEN
            - name: CLOUDFLARE_ACCESS_TEAM_URL
              valueFrom:
                secretKeyRef:
                  name: sms-receiver-secrets
                  key: CLOUDFLARE_ACCESS_TEAM_URL
                  optional: true
            - name: HEARTBEAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: sms-receiver-secrets
                  key: HEARTBEAT_TOKEN
                  optional: true
            - name: HEARTBEAT_TIMEOUT
              value: "15m"
            - name: CLOUDFLARE_ACCESS_AUD
              valueFrom:
                secretKeyRef:
                  name: sms-receiver-secrets
                  key: CLOUDFLARE_ACCESS_AUD
                  optional: true
            - name: COOKIE_SECURE
              value: "false"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          # A database outage affects readiness, without forcing app restarts.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: sms-receiver
  namespace: sms-receiver
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: sms-receiver
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
